name: Build and Publish openclaw-myuse

on:
  push:
    branches: [main]
    paths:
      - "docs/mychange/IMAGE_BUILD_TRIGGER.md"
  workflow_dispatch:
    inputs:
      publish:
        description: "Type 1 to build and publish openclaw-myuse"
        required: true
        default: "1"

concurrency:
  group: openclaw-myuse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openclaw-myuse

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish == '1' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tags and labels
        id: meta
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main)
              version="main"
              tags=("${IMAGE}:main" "${IMAGE}:latest" "${IMAGE}:sha-${GITHUB_SHA::7}")
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              tags=("${IMAGE}:${version}" "${IMAGE}:latest" "${IMAGE}:sha-${GITHUB_SHA::7}")
              ;;
            *)
              echo "::error::This workflow only publishes main or v* tags."
              exit 1
              ;;
          esac

          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openclaw-myuse
          cache-to: type=gha,mode=max,scope=openclaw-myuse
