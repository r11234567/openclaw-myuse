name: Manual OpenClaw Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name to push"
        required: true
        default: "ghcr.io/srvtkuy/openclaw"
      tag:
        description: "Image tag to push"
        required: true
        default: "manual"
      extensions:
        description: "Comma-separated bundled extensions"
        required: true
        default: "telegram,searxng,google"
      apt_packages:
        description: "Extra apt packages for the runtime image"
        required: false
        default: ""
      pip_packages:
        description: "Extra Python packages for the runtime image"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.image_name }}:${{ inputs.tag }}-${{ github.sha }}
          build-args: |
            OPENCLAW_EXTENSIONS=${{ inputs.extensions }}
            OPENCLAW_IMAGE_APT_PACKAGES=${{ inputs.apt_packages }}
            OPENCLAW_IMAGE_PIP_PACKAGES=${{ inputs.pip_packages }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
