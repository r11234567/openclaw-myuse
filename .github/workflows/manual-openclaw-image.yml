name: Manual OpenClaw Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name to push"
        required: true
        default: "ghcr.io/r11234567/openclaw"
      tag:
        description: "Image tag to push"
        required: true
        default: "manual"
      extensions:
        description: "Comma-separated bundled extensions"
        required: true
        default: "telegram,searxng,google-pse,browser,canvas"
      apt_packages:
        description: "Extra apt packages for the runtime image"
        required: false
        default: "bzip2 ffmpeg jq ripgrep python3-pip tesseract-ocr poppler-utils"
      pip_packages:
        description: "Extra Python packages for the runtime image"
        required: false
        default: "--index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.9.1+cpu openai-whisper nano-pdf"
      npm_packages:
        description: "Extra npm packages to install globally in the runtime image"
        required: false
        default: "@steipete/oracle @steipete/summarize mcporter"
      go_packages:
        description: "Extra Go packages to install into /usr/local/bin"
        required: false
        default: "github.com/steipete/gifgrep/cmd/gifgrep@latest github.com/steipete/songsee/cmd/songsee@latest"
      install_sherpa_onnx_tts:
        description: "Download sherpa-onnx TTS runtime and default voice model"
        required: false
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          docker system prune -af --volumes
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.image_name }}:${{ inputs.tag }}-${{ github.sha }}
          build-args: |
            OPENCLAW_EXTENSIONS=${{ inputs.extensions }}
            OPENCLAW_IMAGE_APT_PACKAGES=${{ inputs.apt_packages }}
            OPENCLAW_IMAGE_PIP_PACKAGES=${{ inputs.pip_packages }}
            OPENCLAW_IMAGE_NPM_PACKAGES=${{ inputs.npm_packages }}
            OPENCLAW_IMAGE_GO_PACKAGES=${{ inputs.go_packages }}
            OPENCLAW_INSTALL_SHERPA_ONNX_TTS=${{ inputs.install_sherpa_onnx_tts }}
          cache-from: type=gha
