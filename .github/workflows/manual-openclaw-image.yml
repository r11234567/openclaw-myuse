name: Manual OpenClaw Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name to push"
        required: true
        default: "ghcr.io/r11234567/openclaw"
      tag:
        description: "Image tag to push"
        required: true
        default: "manual"
      extensions:
        description: "Comma-separated bundled extensions"
        required: true
        default: "telegram,searxng,google-pse,browser,canvas"
      apt_packages:
        description: "Extra apt packages for the runtime image"
        required: false
        default: ""
      pip_packages:
        description: "Extra Python packages for the runtime image"
        required: false
        default: ""
      include_docs:
        description: "Include docs in the runtime image"
        required: false
        type: boolean
        default: true
      include_qa:
        description: "Include QA assets in the runtime image"
        required: false
        type: boolean
        default: true
      include_extension_sources:
        description: "Include bundled extension source directories in the runtime image"
        required: false
        type: boolean
        default: true
      build_skills_image:
        description: "Also build a heavier skills/media image with Whisper/OCR/PDF/TTS tools"
        required: false
        type: boolean
        default: true
      skills_tag_suffix:
        description: "Suffix for the optional skills/media image tags"
        required: false
        default: "skills"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        run: |
          set -eux
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          docker system prune -af --volumes
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim runtime
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.image_name }}:${{ inputs.tag }}-${{ github.sha }}
          build-args: |
            OPENCLAW_EXTENSIONS=${{ inputs.extensions }}
            OPENCLAW_IMAGE_APT_PACKAGES=${{ inputs.apt_packages }}
            OPENCLAW_IMAGE_PIP_PACKAGES=${{ inputs.pip_packages }}
            OPENCLAW_INCLUDE_DOCS=${{ inputs.include_docs && '1' || '0' }}
            OPENCLAW_INCLUDE_QA=${{ inputs.include_qa && '1' || '0' }}
            OPENCLAW_INCLUDE_EXTENSION_SOURCES=${{ inputs.include_extension_sources && '1' || '0' }}
          cache-from: type=gha

      - name: Build and push skills/media runtime
        if: ${{ inputs.build_skills_image }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile.skills
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.skills_tag_suffix }}
            ${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.skills_tag_suffix }}-${{ github.sha }}
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ inputs.image_name }}:${{ inputs.tag }}-${{ github.sha }}
          cache-from: type=gha
