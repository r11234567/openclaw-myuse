name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: manual
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set snapshot LOC comparison baseline
        run: |
          set -euo pipefail
          # This manual workflow validates a committed deployment snapshot, not a PR diff.
          # Focused checks below own the local deployment delta; the aggregate check needs
          # a valid origin/main ref without applying the upstream PR LOC ratchet to it.
          git update-ref refs/remotes/origin/main HEAD

      - name: Set up repository Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"

      - name: Install Telegram rich Markdown converter
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          "$python_bin" -m pip install \
            pyromark==0.9.13 \
            git+https://github.com/sudoskys/telegramify-markdown.git@ad2456037ac1dd3bcd06038915dac45a4430ff23
          "$python_bin" -c "import telegramify_markdown"
          # zizmor: ignore[github-env] python_bin is resolved from the trusted runner PATH.
          echo "OPENCLAW_TELEGRAMIFY_PYTHON=$python_bin" >> "$GITHUB_ENV"

      - name: Check changed-file formatting
        run: >-
          pnpm format:check --
          .github/workflows/manual-docker-build.yml
          extensions/telegram/src/channel-actions.contract.test.ts
          extensions/telegram/src/channel.ts
          extensions/telegram/src/rich-message.ts
          extensions/telegram/src/telegramify-markdown.test.ts
          extensions/telegram/src/telegramify-markdown.ts
          ui/src/components/markdown.test.ts
          ui/src/components/markdown.ts
          ui/src/lib/chat/chat-types.ts
          ui/src/pages/chat/components/chat-thread.ts
          ui/src/pages/chat/chat-thread.test.ts
          ui/src/pages/chat/chat-thread.ts
          ui/src/styles/chat/text.css
          docs/channels/telegram.md
          docs/plugins/sdk-channel-plugins.md
          extensions/telegram/src/thread-bindings.ts
          src/auto-reply/thinking.test.ts
          src/agents/system-prompt.test.ts
          src/agents/system-prompt.ts
          src/auto-reply/thinking.ts
          src/auto-reply/commands-registry.shared.ts
          src/auto-reply/reply/commands-name.test.ts
          src/auto-reply/reply/commands-name.ts
          src/auto-reply/reply/commands-session-history.test.ts
          src/auto-reply/reply/commands-session-history.ts
          src/auto-reply/reply/commands-session.ts
          src/auto-reply/reply/session.test.ts
          src/auto-reply/reply/session.ts
          src/channels/plugins/contracts/test-helpers/registry-session-binding.ts
          src/config/sessions/session-accessor.ts
          src/infra/outbound/session-binding-service.test.ts
          src/infra/outbound/session-binding-service.ts
          src/infra/outbound/session-binding.types.ts

      - name: Check source types and lint
        run: pnpm check

      - name: Check test types
        run: pnpm check:test-types

      - name: Run focused deployment tests
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: >-
          pnpm test
          extensions/telegram/src/channel-actions.contract.test.ts
          extensions/telegram/src/telegramify-markdown.test.ts
          src/agents/system-prompt.test.ts
          src/auto-reply/thinking.test.ts
          src/auto-reply/reply/commands-session-history.test.ts
          src/auto-reply/reply/session.test.ts
          src/auto-reply/reply/commands-name.test.ts
          src/channels/plugins/contracts/session-binding.registry-backed.contract.test.ts
          src/infra/outbound/session-binding-service.test.ts
          src/infra/outbound/current-conversation-bindings.test.ts

      - name: Run focused Control UI test
        run: >-
          pnpm --dir ui test
          src/components/markdown.test.ts
          src/pages/chat/chat-pane.test.ts
          src/pages/chat/chat-thread.test.ts
          src/pages/chat/chat-view.test.ts

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve image references
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=${image}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha,scope=manual-openclaw-amd64
          cache-to: type=gha,mode=max,scope=manual-openclaw-amd64
          build-args: |
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex,searxng,google,qqbot
            OPENCLAW_IMAGE_PIP_PACKAGES=pyromark==0.9.13 git+https://github.com/sudoskys/telegramify-markdown.git@ad2456037ac1dd3bcd06038915dac45a4430ff23
          tags: |
            ${{ steps.image.outputs.tags }}
            ${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          push: true
